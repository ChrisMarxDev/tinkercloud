<svg
  xmlns="http://www.w3.org/2000/svg"
  width="1024"
  height="1024"
  viewBox="0 0 1024 1024"
  fill="none"
  role="img"
  aria-labelledby="title description"
  shape-rendering="geometricPrecision"
>
  <title id="title">Tinkerbox cloud-in-box mark</title>
  <desc id="description">
    A friendly cream cloud sits low inside a rounded purple box with a cobalt
    side and an open violet lid.
  </desc>

  <defs>
    <style>
      .plane {
        stroke: #1b0d50;
        stroke-width: 28;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>

  <!--
    Shared affine geometry:

      front vector  = (465, 32.55)
      depth vector  = (140, -81.20)
      body vector   = (0, 310)

    The opening, front, and side therefore share their corner coordinates
    exactly. Every rounded corner uses tangent points on its adjacent edges and
    a quadratic Bézier through the mathematical corner.
  -->

  <!-- The lid rotates upward from the opening's shared rear edge. -->
  <path
    class="plane"
    d="
      M 350.12 220.43
      L 751.28 248.52
      Q 783.2 250.75 791.5 281.65
      L 816.7 375.45
      Q 825 406.35 793.08 404.12
      L 391.92 376.03
      Q 360 373.8 351.7 342.9
      L 326.5 249.1
      Q 318.2 218.2 350.12 220.43
      Z
    "
    fill="#6336E2"
  />

  <!--
    Dark interior plane:
      front edge (220,455) → (685,487.55)
      rear edge  (360,373.8) → (825,406.35)
  -->
  <path
    class="plane"
    d="
      M 385.94 375.62
      L 799.06 404.53
      Q 825 406.35 802.51 419.39
      L 707.49 474.51
      Q 685 487.55 659.06 485.73
      L 245.94 456.82
      Q 220 455 242.49 441.96
      L 337.51 386.84
      Q 360 373.8 385.94 375.62
      Z
    "
    fill="#1B0D50"
  />

  <!-- One continuous cloud shape; its lower edge is occluded by the front. -->
  <path
    d="
      M 350 526
      C 341 508 340 487 345 469
      C 354 437 381 416 414 417
      C 423 366 464 332 517 334
      C 568 336 607 371 614 420
      C 647 412 679 427 696 454
      C 709 474 711 501 701 526
      Z
    "
    fill="#FFF8E7"
    stroke="#2B0B79"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- The eyes intentionally extend behind the rim so the cloud sits inside. -->
  <g fill="#2B0B79">
    <rect x="482" y="440" width="22" height="54" rx="6"/>
    <rect x="538" y="444" width="22" height="54" rx="6"/>
  </g>

  <!--
    Right depth plane. Its two front corners are deliberately square beneath
    the front plane, while only the exposed rear corners are rounded. This
    produces one clean shared seam without doubled corner bulges.
  -->
  <path
    d="
      M 685 487.55
      L 799.05 421.4
      Q 825 406.35 825 436.35
      L 825 686.35
      Q 825 716.35 799.05 731.4
      L 685 797.55
      Z
    "
    fill="#0A7FF5"
  />
  <path
    d="
      M 685 487.55
      L 799.05 421.4
      Q 825 406.35 825 436.35
      L 825 686.35
      Q 825 716.35 799.05 731.4
      L 685 797.55
    "
    fill="none"
    stroke="#1B0D50"
    stroke-width="28"
    stroke-linecap="butt"
    stroke-linejoin="round"
  />

  <!-- Dominant front plane: front vector (465, 32.55), body vector (0, 310). -->
  <path
    class="plane"
    d="
      M 255.91 457.51
      L 649.09 485.04
      Q 685 487.55 685 523.55
      L 685 761.55
      Q 685 797.55 649.09 795.04
      L 255.91 767.51
      Q 220 765 220 729
      L 220 491
      Q 220 455 255.91 457.51
      Z
    "
    fill="#2B0B79"
  />

  <!-- Exact round join for the three edges meeting at the lower front corner. -->
  <circle cx="685" cy="797.55" r="14" fill="#1B0D50"/>
</svg>
