{{define "content"}}
<main class="tinker-auth" id="main">
  <section class="tinker-auth-card" aria-labelledby="error-title">
    <a class="tinker-brand" href="{{.Href}}" aria-label="Tinkercloud">
      <span class="tinker-brand__mark" aria-hidden="true">{{tinkerMark}}</span>
      <span>tinkercloud</span>
    </a>
    <p class="tinker-eyebrow">Safe next step</p>
    <h1 id="error-title">{{.Title}}</h1>
    <div class="tinker-notice tinker-notice--warning" role="alert"><p>{{.Message}}</p></div>
    <a class="tinker-button tinker-button--primary tinker-button--full" href="{{.Href}}">{{.Label}}</a>
  </section>
</main>
{{end}}
