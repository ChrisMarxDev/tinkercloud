{{define "content"}}
<main class="tiny-auth" id="main">
  <section class="tiny-auth-card" aria-labelledby="login-title">
    <a class="tiny-brand" href="/login" aria-label="TinyHost sign in">
      <span class="tiny-brand__mark" aria-hidden="true">{{tinyMark}}</span>
      <span>tinyhost</span>
    </a>
    <p class="tiny-eyebrow">Private control plane</p>
    <h1 id="login-title">Welcome back.</h1>
    <p class="tiny-auth-card__intro">
      Sign in with the email your TinyHost operator authorized.
    </p>
    {{if .Message}}
      <div class="tiny-notice" role="status"><p>{{.Message}}</p></div>
    {{end}}
    <form class="tiny-stack" method="post" action="/login">
      <label class="tiny-field">
        <span class="tiny-label">Email address</span>
        <input class="tiny-input" name="email" type="email" autocomplete="email" required>
      </label>
      <button class="tiny-button tiny-button--primary tiny-button--full" type="submit">
        Send one-time code
      </button>
    </form>
    <p class="tiny-auth-card__footer">
      Authorized deployers only. TinyHost never reveals whether an address is on the allowlist.
    </p>
  </section>
</main>
{{end}}
