{{define "content"}}
<main class="tiny-auth" id="main">
  <section class="tiny-auth-card" aria-labelledby="verify-title">
    <a class="tiny-brand" href="/login" aria-label="TinyHost sign in">
      <span class="tiny-brand__mark" aria-hidden="true">{{tinyMark}}</span>
      <span>tinyhost</span>
    </a>
    <p class="tiny-eyebrow">One small step</p>
    <h1 id="verify-title">Check your email.</h1>
    <p class="tiny-auth-card__intro">
      Enter the one-time code from your sign-in email.
    </p>
    {{if .Message}}
      <div class="tiny-notice" role="status"><p>{{.Message}}</p></div>
    {{end}}
    <form class="tiny-stack" method="post" action="/login/verify">
      <input type="hidden" name="transaction" value="{{.Transaction}}">
      <label class="tiny-field">
        <span class="tiny-label">One-time code</span>
        <input
          class="tiny-input tiny-input--code"
          name="code"
          inputmode="numeric"
          autocomplete="one-time-code"
          required
        >
      </label>
      <button class="tiny-button tiny-button--primary tiny-button--full" type="submit">
        Verify and continue
      </button>
    </form>
    <p class="tiny-auth-card__footer"><a href="/login">Start again</a></p>
  </section>
</main>
{{end}}
