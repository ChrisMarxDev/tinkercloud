name: beta-release
run-name: Beta release v${{ inputs.version }}

on:
  workflow_call:
    inputs:
      version:
        description: Strict MAJOR.MINOR.PATCH version with an existing vVERSION tag on main
        required: true
        type: string
      confirmation:
        description: Type publish-beta-vVERSION using the exact version above
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: beta-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      source_commit: ${{ steps.source.outputs.source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Validate beta source and authority
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "beta version must be strict MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          tag="v$VERSION"
          if [[ "$CONFIRMATION" != "publish-beta-$tag" ]]; then
            echo "beta publication confirmation mismatch" >&2
            exit 1
          fi
          TINKERCLOUD_REQUIRED_RELEASE_CHANNEL=beta ./scripts/check-release-key-policy.sh
          git show-ref --verify --quiet "refs/tags/$tag" || {
            echo "beta source tag is unavailable" >&2
            exit 1
          }
          source_commit=$(git rev-list -n 1 "$tag")
          git merge-base --is-ancestor "$source_commit" origin/main || {
            echo "beta source tag is not reachable from origin/main" >&2
            exit 1
          }
          git checkout --detach "$source_commit"
          test -z "$(git status --porcelain=v1)" || {
            echo "beta source checkout is dirty" >&2
            exit 1
          }
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release already exists for $tag" >&2
            exit 1
          fi
          visibility=$(gh repo view "$GITHUB_REPOSITORY" --json visibility --jq .visibility)
          if [[ "$visibility" != "PUBLIC" ]]; then
            echo "public beta distribution requires a public GitHub repository" >&2
            exit 1
          fi
          package_version=$(node -p "require('./sdk/typescript/package.json').version")
          jsr_version=$(node -p "require('./sdk/typescript/jsr.json').version")
          sdk_version=$(node ./scripts/extract-sdk-version.mjs sdk/typescript/src/index.ts)
          if [[ "$package_version" != "$VERSION" || "$jsr_version" != "$VERSION" || "$sdk_version" != "$VERSION" ]]; then
            echo "beta version declarations do not match $VERSION" >&2
            exit 1
          fi
          echo "source_commit=$source_commit" >>"$GITHUB_OUTPUT"
      - name: Install SDK dependencies
        run: npm ci
        working-directory: sdk/typescript
      - name: Test SDK
        run: npm test
        working-directory: sdk/typescript
      - name: Audit production npm graph
        run: npm audit --omit=dev --package-lock-only
        working-directory: sdk/typescript
      - name: Vet Go
        run: go vet ./...
      - name: Test Go
        run: go test ./...
      - name: Race-test Go
        run: go test -race ./internal/... ./cmd/...
      - name: Run offline security gates
        run: ./scripts/ci-security-gates.sh
      - name: Scan Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Check agent-skill drift
        run: ./scripts/check-skill-drift
      - name: Check beta workflow contract
        run: ./scripts/check-beta-release-workflow.sh
      - name: Test beta workflow denial checker
        run: ./scripts/check-beta-release-workflow-self-test.sh
      - name: Check SDK npm beta workflow contract
        run: ./scripts/check-npm-sdk-workflow.sh
      - name: Test SDK npm beta workflow denial checker
        run: ./scripts/check-npm-sdk-workflow-self-test.sh
      - name: Test exact SDK publish-candidate verifier
        run: ./scripts/verify-sdk-publish-candidate-self-test.sh
      - name: Check embedded release authorities
        run: |
          TINKERCLOUD_REQUIRED_RELEASE_CHANNEL=beta ./scripts/check-release-key-policy.sh
          ./scripts/check-release-key-drift.sh
      - name: Lint GitHub Actions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Test release tamper and reproducibility gates
        run: ./scripts/release-test.sh
      - name: Test installers
        run: ./packaging/install_test.sh

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: beta-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.source_commit }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Revalidate immutable source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          EXPECTED_COMMIT: ${{ needs.validate.outputs.source_commit }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          current_commit=$(git rev-parse HEAD)
          tag_commit=$(git rev-list -n 1 "$tag")
          if [[ "$current_commit" != "$EXPECTED_COMMIT" || "$tag_commit" != "$EXPECTED_COMMIT" ]]; then
            echo "beta source changed after validation" >&2
            exit 1
          fi
          test -z "$(git status --porcelain=v1)" || {
            echo "beta source checkout is dirty" >&2
            exit 1
          }
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release already exists for $tag" >&2
            exit 1
          fi
      - name: Build the signed beta release
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
          SIGNING_KEY_B64: ${{ secrets.TINKERCLOUD_BETA_RELEASE_SIGNING_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY_B64" || {
            echo "beta release signing key is unavailable" >&2
            exit 1
          }
          umask 077
          key_file=$(mktemp "$RUNNER_TEMP/.tinkercloud-beta-release-key.XXXXXX")
          release_dir="$RUNNER_TEMP/tinkercloud-beta-release-v$VERSION"
          cleanup() {
            rm -f "$key_file"
          }
          trap cleanup EXIT HUP INT TERM
          printf '%s' "$SIGNING_KEY_B64" | base64 --decode >"$key_file"
          unset SIGNING_KEY_B64
          chmod 0600 "$key_file"
          source_date_epoch=$(git show -s --format=%ct "$SOURCE_COMMIT")
          TINKERCLOUD_RELEASE_SIGNING_KEY="$key_file" \
            SOURCE_DATE_EPOCH="$source_date_epoch" \
            ./scripts/release-build.sh "$VERSION" "$release_dir"
          echo "RELEASE_DIR=$release_dir" >>"$GITHUB_ENV"
      - name: Verify the complete local release
        run: ./scripts/release-verify.sh "$RELEASE_DIR"
      - name: Create the draft GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          release_base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/"
          notes="$RUNNER_TEMP/beta-release-notes.md"
          {
            printf '# Beta release %s\n\n' "$tag"
            printf 'This is a beta prerelease. It is not a stable or latest release.\n\n'
            printf 'Install Tinkercloud from a fresh supported VPS root shell:\n\n'
            printf '```sh\n'
            printf "curl --proto '=https' --proto-redir '=https' --tlsv1.2 -fsSL %sinstall-host.sh | sh\n" "$release_base"
            printf '```\n\n'
            printf 'Install the workstation CLI:\n\n'
            printf '```sh\n'
            printf "curl --proto '=https' --tlsv1.2 -fsSL %sinstall-client.sh | sh\n" "$release_base"
            printf '```\n\n'
            printf 'Optional workstation SSH installation after installing the CLI:\n\n'
            printf '```sh\n'
            printf 'tinker host install root@HOST\n'
            printf '```\n\n'
            printf 'The released root installer embeds that exact immutable versioned release URL. The released CLI also derives it from its embedded build version. Development or advanced operator flows may pass '
            printf "\`--release-base %s\`" "$release_base"
            printf ' explicitly.\n\n'
            printf 'Install the TypeScript SDK directly from this GitHub release:\n\n'
            printf '```sh\n'
            printf 'npm install %stinkercloud-sdk-%s.tgz\n' "$release_base" "$VERSION"
            printf '```\n\n'
            printf 'Every payload is covered by the attached checksums, Ed25519 signatures, and signed release manifest.\n'
          } >"$notes"
          assets=()
          while IFS= read -r asset; do
            assets+=("$asset")
          done < <(find "$RELEASE_DIR" -maxdepth 1 -type f -print | LC_ALL=C sort)
          test "${#assets[@]}" -gt 0 || {
            echo "verified release has no assets" >&2
            exit 1
          }
          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --prerelease \
            --title "$tag beta" \
            --notes-file "$notes"
      - name: Verify the uploaded draft bytes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          state=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,tagName \
            --jq '[.isDraft,.isPrerelease,.tagName] | @tsv')
          if [[ "$state" != $'true\ttrue\t'"$tag" ]]; then
            echo "unexpected draft release state" >&2
            exit 1
          fi
          remote_dir="$RUNNER_TEMP/tinkercloud-beta-remote-v$VERSION"
          mkdir -p "$remote_dir"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$remote_dir"
          (
            cd "$RELEASE_DIR"
            find . -maxdepth 1 -type f -print | LC_ALL=C sort
          ) >"$RUNNER_TEMP/local-assets.txt"
          (
            cd "$remote_dir"
            find . -maxdepth 1 -type f -print | LC_ALL=C sort
          ) >"$RUNNER_TEMP/remote-assets.txt"
          cmp "$RUNNER_TEMP/local-assets.txt" "$RUNNER_TEMP/remote-assets.txt" || {
            echo "draft release asset set drifted" >&2
            exit 1
          }
          ./scripts/release-verify.sh "$remote_dir"
      - name: Publish the verified prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          gh release edit "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --prerelease \
            --latest=false
          state=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,tagName \
            --jq '[.isDraft,.isPrerelease,.tagName] | @tsv')
          if [[ "$state" != $'false\ttrue\t'"$tag" ]]; then
            echo "unexpected published beta release state" >&2
            exit 1
          fi
      - name: Smoke-test the public installer
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          release_base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/"
          install_dir="$RUNNER_TEMP/tinkercloud-beta-bin"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --retry 5 --retry-all-errors "$release_base/install-client.sh" |
            TINKER_INSTALL_DIR="$install_dir" sh
          installed_version=$("$install_dir/tinker" version)
          if [[ "$installed_version" != "tinker $VERSION" ]]; then
            echo "public beta installer version mismatch" >&2
            exit 1
          fi
          sdk_consumer="$RUNNER_TEMP/tinkercloud-beta-sdk-consumer"
          mkdir -p "$sdk_consumer"
          (
            cd "$sdk_consumer"
            npm init --yes >/dev/null
            npm install --ignore-scripts \
              "$release_base/tinkercloud-sdk-$VERSION.tgz" >/dev/null
            SDK_VERSION="$VERSION" node --input-type=module -e '
              import { SDK_VERSION } from "@tinkercloud/sdk";
              if (SDK_VERSION !== process.env.SDK_VERSION) process.exit(1);
            '
          )
