name: release-verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-release-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
        working-directory: sdk/typescript
      - run: npm test
        working-directory: sdk/typescript
      - run: npm audit --omit=dev --package-lock-only
        working-directory: sdk/typescript
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./internal/... ./cmd/...
      - run: ./scripts/ci-security-gates.sh
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - run: ./scripts/check-skill-drift
      - run: ./scripts/check-beta-release-workflow.sh
      - run: ./scripts/check-beta-release-workflow-self-test.sh
      - run: ./scripts/check-release-key-drift.sh
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - run: ./scripts/release-test.sh
      - run: ./packaging/install_test.sh
