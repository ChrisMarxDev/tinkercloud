name: release-verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-release-pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
        working-directory: sdk/typescript
      - run: npm test
        working-directory: sdk/typescript
      - run: npm audit --omit=dev --package-lock-only
        working-directory: sdk/typescript
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./internal/... ./cmd/...
      - run: ./scripts/ci-security-gates.sh
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - run: ./scripts/check-skill-drift
      - run: ./scripts/release-test.sh
      - run: ./packaging/install_test.sh
