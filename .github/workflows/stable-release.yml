name: stable-release
run-name: Stable release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Strict MAJOR.MINOR.PATCH version with an existing vVERSION tag on main
        required: true
        type: string
      confirmation:
        description: Type publish-stable-vVERSION using the exact version above
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      source_commit: ${{ steps.source.outputs.source_commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Validate stable source and production authority
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "stable version must be strict MAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          tag="v$VERSION"
          if [[ "$CONFIRMATION" != "publish-stable-$tag" ]]; then
            echo "stable publication confirmation mismatch" >&2
            exit 1
          fi
          TINKERCLOUD_REQUIRED_RELEASE_CHANNEL=production ./scripts/check-release-key-policy.sh
          ./scripts/check-release-key-drift.sh
          git show-ref --verify --quiet "refs/tags/$tag" || {
            echo "stable source tag is unavailable" >&2
            exit 1
          }
          source_commit=$(git rev-list -n 1 "$tag")
          git merge-base --is-ancestor "$source_commit" origin/main || {
            echo "stable source tag is not reachable from origin/main" >&2
            exit 1
          }
          git checkout --detach "$source_commit"
          test -z "$(git status --porcelain=v1)" || {
            echo "stable source checkout is dirty" >&2
            exit 1
          }
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release already exists for $tag" >&2
            exit 1
          fi
          visibility=$(gh repo view "$GITHUB_REPOSITORY" --json visibility --jq .visibility)
          if [[ "$visibility" != "PUBLIC" ]]; then
            echo "stable distribution requires a public GitHub repository" >&2
            exit 1
          fi
          package_version=$(node -p "require('./sdk/typescript/package.json').version")
          jsr_version=$(node -p "require('./sdk/typescript/jsr.json').version")
          sdk_version=$(sed -n 's/^export const SDK_VERSION = "\([^"]*\)";.*/\1/p' sdk/typescript/src/index.ts)
          if [[ "$package_version" != "$VERSION" || "$jsr_version" != "$VERSION" || "$sdk_version" != "$VERSION" ]]; then
            echo "stable version declarations do not match $VERSION" >&2
            exit 1
          fi
          echo "source_commit=$source_commit" >>"$GITHUB_OUTPUT"
      - name: Install SDK dependencies
        run: npm ci
        working-directory: sdk/typescript
      - name: Test SDK
        run: npm test
        working-directory: sdk/typescript
      - name: Audit production npm graph
        run: npm audit --omit=dev --package-lock-only
        working-directory: sdk/typescript
      - name: Vet Go
        run: go vet ./...
      - name: Test Go
        run: go test ./...
      - name: Race-test Go
        run: go test -race ./internal/... ./cmd/...
      - name: Run offline security gates
        run: ./scripts/ci-security-gates.sh
      - name: Scan Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Check agent-skill drift
        run: ./scripts/check-skill-drift
      - name: Check stable workflow contracts
        run: ./scripts/check-stable-release-workflows.sh
      - name: Test stable workflow denial checker
        run: ./scripts/check-stable-release-workflows-self-test.sh
      - name: Lint GitHub Actions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Test release tamper and reproducibility gates
        run: ./scripts/release-test.sh
      - name: Test installers
        run: ./packaging/install_test.sh

  publish:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: stable-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate.outputs.source_commit }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Revalidate immutable source and production authority
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          EXPECTED_COMMIT: ${{ needs.validate.outputs.source_commit }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          current_commit=$(git rev-parse HEAD)
          tag_commit=$(git rev-list -n 1 "$tag")
          if [[ "$current_commit" != "$EXPECTED_COMMIT" || "$tag_commit" != "$EXPECTED_COMMIT" ]]; then
            echo "stable source changed after validation" >&2
            exit 1
          fi
          test -z "$(git status --porcelain=v1)" || {
            echo "stable source checkout is dirty" >&2
            exit 1
          }
          TINKERCLOUD_REQUIRED_RELEASE_CHANNEL=production ./scripts/check-release-key-policy.sh
          ./scripts/check-release-key-drift.sh
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release already exists for $tag" >&2
            exit 1
          fi
      - name: Build the signed stable release
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
          SIGNING_KEY_B64: ${{ secrets.TINKERCLOUD_RELEASE_SIGNING_KEY_B64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY_B64" || {
            echo "stable release signing key is unavailable" >&2
            exit 1
          }
          umask 077
          key_file=$(mktemp "$RUNNER_TEMP/.tinkercloud-stable-release-key.XXXXXX")
          release_dir="$RUNNER_TEMP/tinkercloud-stable-release-v$VERSION"
          cleanup() { rm -f "$key_file"; }
          trap cleanup EXIT HUP INT TERM
          printf '%s' "$SIGNING_KEY_B64" | base64 --decode >"$key_file"
          unset SIGNING_KEY_B64
          chmod 0600 "$key_file"
          source_date_epoch=$(git show -s --format=%ct "$SOURCE_COMMIT")
          TINKERCLOUD_RELEASE_SIGNING_KEY="$key_file" \
            SOURCE_DATE_EPOCH="$source_date_epoch" \
            ./scripts/release-build.sh "$VERSION" "$release_dir"
          echo "RELEASE_DIR=$release_dir" >>"$GITHUB_ENV"
      - name: Verify the complete local release
        run: ./scripts/release-verify.sh "$RELEASE_DIR"
      - name: Create the draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          release_base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$tag/"
          latest_base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/latest/download/"
          notes="$RUNNER_TEMP/stable-release-notes.md"
          {
            printf '# Tinkercloud %s\n\n' "$tag"
            printf 'Install the Tinker CLI with the stable one-line installer:\n\n'
            printf '```sh\n'
            printf "curl --proto '=https' --tlsv1.2 -fsSL %sinstall-client.sh | TINKER_RELEASE_BASE=%s sh\n" "$latest_base" "$latest_base"
            printf '```\n\n'
            printf 'Reproducible exact-version installation:\n\n'
            printf '```sh\n'
            printf "curl --proto '=https' --tlsv1.2 -fsSL %sinstall-client.sh | TINKER_RELEASE_BASE=%s sh\n" "$release_base" "$release_base"
            printf '```\n\n'
            printf 'The npm CLI package is published separately from these exact verified bytes.\n\n'
            printf 'Every release payload is covered by checksums, Ed25519 signatures, and the signed release manifest.\n'
          } >"$notes"
          assets=()
          while IFS= read -r asset; do assets+=("$asset"); done < <(find "$RELEASE_DIR" -maxdepth 1 -type f -print | LC_ALL=C sort)
          test "${#assets[@]}" -gt 0 || { echo "verified release has no assets" >&2; exit 1; }
          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "$tag" \
            --notes-file "$notes"
      - name: Verify the uploaded draft bytes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          state=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName --jq '[.isDraft,.isPrerelease,.tagName] | @tsv')
          if [[ "$state" != $'true\tfalse\t'"$tag" ]]; then
            echo "unexpected draft stable release state" >&2
            exit 1
          fi
          remote_dir="$RUNNER_TEMP/tinkercloud-stable-remote-v$VERSION"
          mkdir -p "$remote_dir"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$remote_dir"
          (cd "$RELEASE_DIR" && find . -maxdepth 1 -type f -print | LC_ALL=C sort) >"$RUNNER_TEMP/local-assets.txt"
          (cd "$remote_dir" && find . -maxdepth 1 -type f -print | LC_ALL=C sort) >"$RUNNER_TEMP/remote-assets.txt"
          cmp "$RUNNER_TEMP/local-assets.txt" "$RUNNER_TEMP/remote-assets.txt" || {
            echo "draft release asset set drifted" >&2
            exit 1
          }
          ./scripts/release-verify.sh "$remote_dir"
      - name: Publish the verified stable release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          state=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease,tagName --jq '[.isDraft,.isPrerelease,.tagName] | @tsv')
          if [[ "$state" != $'false\tfalse\t'"$tag" ]]; then
            echo "unexpected published stable release state" >&2
            exit 1
          fi
      - name: Smoke-test exact and latest one-line installers
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          for selector in "download/v$VERSION" "latest/download"; do
            release_base="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/$selector/"
            install_dir="$RUNNER_TEMP/tinkercloud-${selector//\//-}-bin"
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location --retry 5 --retry-all-errors \
              "$release_base/install-client.sh" |
              TINKER_RELEASE_BASE="$release_base" TINKER_INSTALL_DIR="$install_dir" sh
            installed_version=$("$install_dir/tinker" version)
            if [[ "$installed_version" != "tinker $VERSION" ]]; then
              echo "public stable installer version mismatch" >&2
              exit 1
            fi
          done
