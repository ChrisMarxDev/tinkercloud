name: stable-release
run-name: Stable release v${{ inputs.version }}

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      confirmation:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - name: Validate stable source and production authority
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "stable version must be strict MAJOR.MINOR.PATCH" >&2; exit 1; }
          tag="v$VERSION"
          [[ "$CONFIRMATION" == "publish-stable-$tag" ]] || { echo "stable publication confirmation mismatch" >&2; exit 1; }
          TINKERCLOUD_REQUIRED_RELEASE_CHANNEL=production ./scripts/check-release-key-policy.sh
          ./scripts/check-release-key-drift.sh
          git show-ref --verify --quiet "refs/tags/$tag" || { echo "stable source tag is unavailable" >&2; exit 1; }
          source_commit=$(git rev-list -n 1 "$tag")
          git merge-base --is-ancestor "$source_commit" origin/main || { echo "stable source tag is not reachable from origin/main" >&2; exit 1; }
          git checkout --detach "$source_commit"
          test -z "$(git status --porcelain=v1)" || { echo "stable source checkout is dirty" >&2; exit 1; }
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "GitHub release already exists for $tag" >&2; exit 1; fi
          visibility=$(gh repo view "$GITHUB_REPOSITORY" --json visibility --jq .visibility)
          [[ "$visibility" == "PUBLIC" ]] || { echo "public stable distribution requires a public GitHub repository" >&2; exit 1; }
          package_version=$(node -p "require('./sdk/typescript/package.json').version")
          jsr_version=$(node -p "require('./sdk/typescript/jsr.json').version")
          sdk_version=$(node ./scripts/extract-sdk-version.mjs sdk/typescript/src/index.ts)
          [[ "$package_version" == "$VERSION" && "$jsr_version" == "$VERSION" && "$sdk_version" == "$VERSION" ]] || { echo "stable version declarations do not match $VERSION" >&2; exit 1; }
      - name: Install SDK dependencies
        run: npm ci
        working-directory: sdk/typescript
      - name: Test SDK
        run: npm test
        working-directory: sdk/typescript
      - name: Audit production npm graph
        run: npm audit --omit=dev --package-lock-only
        working-directory: sdk/typescript
      - name: Vet Go
        run: go vet ./...
      - name: Test Go
        run: go test ./...
      - name: Race-test Go
        run: go test -race ./internal/... ./cmd/...
      - name: Run offline security gates
        run: ./scripts/ci-security-gates.sh
      - name: Scan Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Check agent-skill drift
        run: ./scripts/check-skill-drift
      - name: Check stable workflow contracts
        run: ./scripts/check-stable-release-workflows.sh
      - name: Test stable workflow denial checker
        run: ./scripts/check-stable-release-workflows-self-test.sh
      - name: Test protected publisher missing-input denial
        run: ./scripts/publish-github-release-self-test.sh
      - name: Lint GitHub Actions
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Test unified workflow contracts
        run: ./scripts/check-unified-release-workflow.sh
      - name: Test unified workflow denial checker
        run: ./scripts/check-unified-release-workflow-self-test.sh
      - name: Test release tamper and reproducibility gates
        run: ./scripts/release-test.sh
      - name: Test installers
        run: ./packaging/install_test.sh
