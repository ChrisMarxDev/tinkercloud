name: Bug report
description: Report a reproducible Tinkercloud defect
title: "bug: "
labels: ["bug", "inbox"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities or include credentials, OTPs, cookies, email addresses, production data, or unredacted logs here. Follow SECURITY.md for private disclosure.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Gateway/server
        - Deployer CLI
        - Browser SDK
        - Installation or update
        - Operations
        - Documentation
        - Other
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, browser, and relevant tool versions
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide exact, minimal steps using synthetic data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Observed result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This report contains no secrets, personal data, or production database contents.
          required: true
        - label: This is not a security vulnerability.
          required: true
