name: Question or support
description: Ask for help using or understanding Tinkercloud
title: "question: "
labels: ["type/question", "status/needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Tinkercloud is pre-release and support is best effort. Never post credentials, OTPs, cookies, personal data, production configuration, or database contents.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: tried
    attributes:
      label: What have you tried?
      description: Include relevant documentation links and redacted output.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, architecture, and relevant tool versions
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the documentation and existing issues.
          required: true
        - label: This is not a security vulnerability.
          required: true
        - label: I have redacted secrets and personal data.
          required: true
